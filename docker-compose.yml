# Local dev Postgres, shared by every git worktree (one database per worktree,
# see scripts/worktree-db.ts). max_connections is raised because several
# worktrees run test suites against the same cluster at once.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
